description: |
  WiFi Internet Watch connects a Flipper Zero Wi-Fi Developer Board to a selected
  wireless network and checks internet availability every 60 seconds.

  **Features**

  - Scans and selects nearby Wi-Fi networks
  - Full lowercase, uppercase, numeric, and symbol password keyboard
  - Saves, updates, and forgets up to 16 network credentials
  - Shows online, offline, and Wi-Fi connection states
  - Plays a notification when internet connectivity returns
  - Detects the devboard firmware automatically and lets you set it manually in the settings menu
  - Lets you change the check target address, the check interval, and the devboard firmware type

  **Supported devboard firmware**

  - ESP-AT: scanning, joining, and internet checks
  - GhostESP: scanning, joining, and internet checks
  - Marauder, Bruce, and Black Magic: recognized, but reported as not supported for internet monitoring

  The official devboard arrives with the Black Magic debug probe firmware, which has
  no Wi-Fi commands. Flash ESP-AT or GhostESP to use this app. An ESP32-S2 running
  ESP-AT must be configured for GPIO17 and GPIO18 at 115200 baud with hardware flow
  control disabled. Setup instructions are available in the source repository.
