short_description: Staff time-clock using NFC, RFID or iButton badges, logging to a CSV timesheet.

description: |
  Staff Time Clock is a standalone staff time-clock for the Flipper Zero.
  Register collaborators on NFC, RFID or iButton badges and log clock IN/OUT
  to a CSV timesheet, fully offline. Identification only - no badge
  emulation, no authentication bypass.

  ## Features

  - Multi-technology reader: NFC, RFID and iButton. Pick which one is active
    with Left/Right on the reader screen; the choice is remembered.
  - Works with existing cards: only the UID is read, never written, so a
    card already used elsewhere can be registered without being changed.
  - Automatic IN/OUT punching, with distinct sound, vibration and LED
    feedback for each.
  - Work mode: a locked kiosk clock; tapping a badge logs the punch and
    greets the person by name.
  - Overview screen: today, week and month worked time plus today's break,
    per collaborator, switch people with Left/Right.
  - History with filters, daily/weekly/monthly summaries, an optional daily
    target with overtime shown.
  - CSV and JSON export, dated and monthly CSV snapshots, backup and
    restore.
  - PIN-protected exit with a 4-step arrow sequence, five UI languages.

  Full documentation, including data file formats and firmware
  compatibility notes, is in the project README linked below.

