short_description: Spirit dilution and mixing calculator
description: |
  A small app for home distillers with three calculators:

  - **Dilute spirit** — enter starting strength, target strength and volume, get the amount of water to add and the resulting volume.
  - **Mix two spirits** — enter volume and strength of two drinks, get the resulting volume and strength.
  - **Target volume** — enter the desired volume and strength of the final drink plus the strength of your spirit, get how much spirit and water to take.

  All values are edited with the Left/Right buttons, like in Flipper's own settings menus.
