short_description: "Simple stopwatch app with millisecond precision and lap split tracking."
description: |
  # Stopwatch Flipper
  A simple and clean stopwatch application with split lap timing for Flipper Zero.

  ## Features

  - Millisecond precision time tracking
  - Split lap recording functionality
  - Simple reset mechanism when stopped
  - Clean monochrome pixel layout optimized for Flipper screen

  ## Controls

  - OK: Start / Stop stopwatch
  - Down: Record split lap (when running)
  - Up: Reset stopwatch (when stopped)
  - BACK: Exit the application
  
