short_description: Test app
description: |
  Controller Ducky turns your Flipper Zero into a USB game controller, emulating Nintendo Switch Pro, PlayStation DualSense, and Xbox controllers. 
  Play directly using the Flipper's buttons or automate gameplay with customizable Ducky-style scripts. 
  Supports button combinations, analog stick inputs, timed actions, and repeatable macros.
  Tested on real Switch 1/2 Hardware.
