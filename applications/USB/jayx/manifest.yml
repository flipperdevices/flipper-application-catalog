short_description: Live PC CPU/RAM/GPU stats, FPS, and system info over USB
description: |
  Live PC monitor for Flipper Zero over USB.

  Displays CPU, RAM, GPU, temperatures, FPS, and system info on the Flipper screen streamed from a Windows companion agent.

  # Features
  - Live CPU, RAM, GPU, and VRAM usage and temperatures
  - FPS and active game or window name (via RTSS)
  - System info cards: OS, CPU, memory, GPU, machine brand
  - USB CDC virtual serial connection

  # Requirements
  - Windows PC with USB cable
  - Python companion agent: pc_agent/monitor.py --usb
  - Optional: NVIDIA drivers for GPU stats, RTSS for FPS, LibreHardwareMonitor for CPU temp

  Full setup and documentation:
  https://github.com/contactjayclatty/JAYX/blob/main/docs/SETUP.md
