short_description: "A tiny on-device waveform editor for Flipper Zero that trims, decodes and merges infrared .ir signals."
description: |
  A tiny on-device waveform editor for Flipper Zero that trims infrared .ir
  signals down to just the part you care about. Open a remote, pick a button,
  let the app find the actual frame, slide two markers to the start and end of
  one clean copy, and save it as a new .ir file.

  Both raw and parsed signals are supported. Parsed signals (NEC, Samsung32,
  RC5, RC6, SIRC, Kaseikyo and others) are rendered by the firmware's own IR
  encoder, so every protocol your firmware knows works.

  **Analysis only.** This app never transmits. It only reads, displays and
  writes files you already have on the SD card.

  ## Features

  - **Decode** the selection with the firmware's IR decoders. Every decoded
    frame is listed and any of them can be saved as a clean parsed signal.
  - **Merge** signals from any .ir files into a single raw signal, so one
    button in the Infrared app can do several things.
  - **Repeat** a signal up to 64 times, set the merge gap and normalize jitter
    in the Config menu.

  ## Controls

  - **Left / Right** - Move the active cut marker (hold = move faster)
  - **Up / Down** - Zoom in / out (centered on the active marker)
  - **OK (short press)** - Switch the active marker between **A** and **B**
  - **OK (hold)** - Open the action menu (**Save / Decode / Cut / Undo**)
  - **Back** - Exit

  ## Usage

  1. Launch IR RAW Edit from the Apps menu, under Infrared.
  2. Pick an .ir file from /ext/infrared, then pick the signal.
  3. The view opens on the detected frame. Zoom out to see the whole signal,
     zoom in to see individual marks and spaces.
  4. Place **A** at the start of one clean frame, press OK, place **B** at the end.
  5. Hold **OK** to open the action menu and choose:
     - **Save** - a name is suggested. Edit it if you like and confirm.
     The A..B selection is written to /ext/infrared/(name).ir as a raw signal.
  6. **Decode** - list the frames found between A and B and save one as a
     parsed signal.
  7. **Cut** - the stretch between A and B is removed from the working copy and
     the two sides are joined.
  8. **Undo** - revert the last cut.
