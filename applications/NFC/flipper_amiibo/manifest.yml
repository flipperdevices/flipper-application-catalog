short_description: Browse amiibo dumps, emulate NTAG215, and sign a new UID per scan.
description: |
  Browse amiibo .bin and .nfc dumps on the SD card, emulate them as NTAG215 tags, and sign a new UID for each scan.

  The key file is not included. Place a 160-byte key_retail.bin in apps_data/flipper_amiibo/. A folder named ZE always uses a new UID. A folder named SSB keeps the UID stored in the file.
